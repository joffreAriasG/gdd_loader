[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdd-loader"
dynamic = ["version"]
description = "Carga de plantillas Excel (gobierno de datos) desde carpeta sincronizada de SharePoint hacia staging en SQL Server on-prem (DGODELIVERY)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "pyodbc>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gdd_loader.__version__"}
